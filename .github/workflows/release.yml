name: Publish macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Apple Silicon release
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        shell: zsh {0}

    steps:
      - name: Check out tagged source and pinned whisper.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify tag matches application version
        id: version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          expected_tag="v${version}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version $version (expected $expected_tag)." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version
          uname -m

      - name: Build pinned whisper.cpp runtime
        run: ./scripts/bootstrap-whisper.sh

      - name: Build and package SwiftVoice
        run: ./scripts/package-release.sh

      - name: Verify release bundle
        run: |
          app="dist/SwiftVoice.app"
          cli="$app/Contents/MacOS/whisper-cli"
          version="${{ steps.version.outputs.version }}"
          archive="release/SwiftVoice-${version}-macOS-arm64.zip"

          test "$(lipo -archs "$app/Contents/MacOS/SwiftVoice")" = "arm64"
          test "$(lipo -archs "$cli")" = "arm64"
          codesign --verify --deep --strict "$app"
          otool -l "$cli" | grep -Fq "@executable_path/../Frameworks"

          if otool -L "$cli" | grep -Eq "/Users/|/opt/homebrew"; then
            echo "whisper-cli contains a non-portable runtime dependency" >&2
            exit 1
          fi

          test -f "$archive"
          (
            cd release
            shasum -a 256 -c "$(basename "$archive").sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/SwiftVoice-${VERSION}-macOS-arm64.zip" \
            "release/SwiftVoice-${VERSION}-macOS-arm64.zip.sha256" \
            --verify-tag \
            --title "SwiftVoice ${VERSION}" \
            --generate-notes
